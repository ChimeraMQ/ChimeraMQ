  # SYSTEM
  # ═══════════════════════════════════════════════════════════

  /v1/health:
    get:
      tags: ["System"]
      summary: "Health check"
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: "Health status"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "healthy"
                node_id: "node-1"
                name: "chimera-1"
                uptime: "24h15m30s"

  /v1/metrics:
    get:
      tags: ["System"]
      summary: "Prometheus metrics"
      operationId: getMetrics
      responses:
        "200":
          description: "Prometheus metrics in text format"
          content:
            text/plain:
              schema:
                type: string

  /v1/cluster/members:
    get:
      tags: ["System"]
      summary: "Cluster members"
      operationId: clusterMembers
      responses:
        "200":
          description: "Cluster membership"
          content:
            application/json:
              oneOf:
                - $ref: "#/components/schemas/ClusterResponse"
                - $ref: "#/components/schemas/SingleNodeResponse"
              examples:
                cluster:
                  summary: "Cluster mode"
                  value:
                    mode: "cluster"
                    is_leader: true
                    leader_id: "node-1"
                    alive_count: 3
                    members:
                      - id: "node-1"
                        addr: "192.168.1.10"
                        port: 7946
                        state: "Alive"
                        incarnation: 1
                      - id: "node-2"
                        addr: "192.168.1.11"
                        port: 7946
                        state: "Alive"
                        incarnation: 2
                single_node:
                  summary: "Single-node mode"
                  value:
                    mode: "single-node"
                    members: null

  /v1/config/reload:
    post:
      tags: ["System"]
      summary: "Reload configuration from file"
      operationId: reloadConfig
      responses:
        "200":
          description: "Configuration reloaded"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  message:
                    type: string
                    example: "configuration reloaded"
        "500":
          description: "Reload failed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ═══════════════════════════════════════════════════════════
  # DEBUG (pprof)
  # ═══════════════════════════════════════════════════════════

  /debug/pprof:
    get:
      tags: ["Debug"]
      summary: "pprof index"
      operationId: pprofIndex
      description: "HTML index of available pprof endpoints"
      responses:
        "200":
          description: "HTML index page"
          content:
            text/html:
              schema:
                type: string

  /debug/pprof/{profile}:
    get:
      tags: ["Debug"]
      summary: "pprof profiles"
      operationId: pprofProfile
      description: |
        Go pprof profiling endpoints. Available profiles:
        `allocs`, `block`, `cmdline`, `goroutine`, `heap`,
        `mutex`, `profile`, `threadcreate`, `trace`.
      parameters:
        - name: profile
          in: path
          required: true
          schema:
            type: string
            enum: ["allocs", "block", "cmdline", "goroutine", "heap", "mutex", "profile", "threadcreate", "trace"]
        - name: seconds
          in: query
          schema:
            type: integer
            default: 30
            maximum: 5
          description: "Duration for profile/trace endpoints"
      responses:
        "200":
          description: "Profile data"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

# ═════════════════════════════════════════════════════════════
# COMPONENTS
# ═════════════════════════════════════════════════════════════

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "API token authentication"
    BasicAuth:
      type: http
      scheme: basic
      description: "Username/password authentication"

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 100
        maximum: 1000
      description: "Maximum items to return"
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: "Number of items to skip"

  responses:
    BadRequest:
      description: "Invalid request"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "invalid request body"
    NotFound:
      description: "Resource not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "topic not found"
    Conflict:
      description: "Resource conflict"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "topic already exists"
    Unauthorized:
      description: "Authentication required"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "unauthorized"
    Forbidden:
      description: "Insufficient permissions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "forbidden"
    ServiceUnavailable:
      description: "Subsystem not available"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "topic manager not available"

  schemas:
    # ─── Error ─────────────────────────────────────────────

    ErrorResponse:
      type: object
      required: ["error"]
      properties:
        error:
          type: string
          description: "Error message"

    # ─── Topics ────────────────────────────────────────────

    CreateTopicRequest:
      type: object
      required: ["name"]
      properties:
        name:
          type: string
          maxLength: 255
          description: "Topic name (no path traversal characters)"
        mode:
          type: string
          enum: ["unified", "stream", "queue"]
          default: "unified"
        partitions:
          type: integer
          format: int32
          minimum: 1
        retention_time:
          type: string
          description: "Retention period (Go duration, e.g. 24h)"
        dlq_topic:
          type: string
          description: "Associated DLQ topic name"
        max_retries:
          type: integer
          format: int32
          minimum: 0
          description: "Max delivery retries before DLQ"

    CreateTopicResponse:
      type: object
      properties:
        name:
          type: string
        mode:
          type: string
        partitions:
          type: integer
          format: int32

    TopicInfo:
      type: object
      properties:
        name:
          type: string
        mode:
          type: string
          enum: ["unified", "stream", "queue"]
        partitions:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time

    TopicDetails:
      type: object
      properties:
        name:
          type: string
        partitions:
          type: array
          items:
            $ref: "#/components/schemas/PartitionStat"

    PartitionStat:
      type: object
      properties:
        id:
          type: integer
          format: int32
        high_watermark:
          type: integer
          format: int64
          description: "Highest committed offset"
        log_start_offset:
          type: integer
          format: int64
          description: "Earliest available offset"

    # ─── Messages ──────────────────────────────────────────

    PublishResponse:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        partition:
          type: integer
          format: int32
        topic:
          type: string

    FetchResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/FetchedMessage"
        next_offset:
          type: integer
          format: int64
        count:
          type: integer

    FetchedMessage:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        content_type:
          type: string
        payload:
          type: string
          format: byte
          description: "Base64-encoded payload"
        headers:
          type: object
          additionalProperties:
            type: string
            format: byte

    AckNackRequest:
      type: object
      required: ["offsets"]
      properties:
        offsets:
          type: array
          items:
            type: integer
            format: int64

    # ─── Consumer Groups ───────────────────────────────────

    ConsumerGroupInfo:
      type: object
      properties:
        group:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/ConsumerMember"
        assignments:
          $ref: "#/components/schemas/AssignmentsMap"

    ConsumerMember:
      type: object
      properties:
        id:
          type: string
        partitions:
          type: array
          items:
            type: integer
            format: int32

    AssignmentsMap:
      type: object
      additionalProperties:
        type: array
        items:
          type: integer
          format: int32
      description: "Map of member ID to assigned partition IDs"

    JoinGroupRequest:
      type: object
      required: ["member_id", "topic"]
      properties:
        member_id:
          type: string
          maxLength: 255
        topic:
          type: string
        partitions:
          type: integer
          format: int32
          minimum: 1
          default: 1
        strategy:
          type: string
          enum: ["range", "round_robin"]
          default: "range"

    OffsetMap:
      type: object
      additionalProperties:
        type: integer
        format: int64
      description: 'Map of partition ID (string key) to committed offset'

    CommitOffsetsRequest:
      type: object
      required: ["offsets"]
      properties:
        offsets:
          $ref: "#/components/schemas/OffsetMap"

    # ─── Schema Registry ───────────────────────────────────

    RegisterSchemaRequest:
      type: object
      required: ["schema"]
      properties:
        type:
          type: string
          enum: ["JSON", "Avro", "Protobuf"]
          description: "Schema type (auto-inferred if omitted)"
        schema:
          type: string
          description: "Schema definition string"

    SchemaVersion:
      type: object
      properties:
        subject:
          type: string
        version:
          type: integer
        type:
          type: string
          enum: ["JSON", "Avro", "Protobuf"]
        schema:
          type: string
        compatibility:
          type: string
          enum: ["none", "backward", "forward", "full"]

    # ─── WASM ──────────────────────────────────────────────

    WasmModuleInfo:
      type: object
      properties:
        name:
          type: string
        status:
          type: string

    # ─── Processors ────────────────────────────────────────

    TopologySpec:
      type: object
      required: ["name", "source", "sink"]
      properties:
        name:
          type: string
          maxLength: 255
        auto_start:
          type: boolean
          default: false
        parallelism:
          type: integer
          format: int32
          minimum: 1
          default: 1
        source:
          $ref: "#/components/schemas/TopologyEndpoint"
        sink:
          $ref: "#/components/schemas/TopologyEndpoint"
        operators:
          type: array
          items:
            $ref: "#/components/schemas/Operator"

    TopologyEndpoint:
      type: object
      required: ["topic"]
      properties:
        topic:
          type: string

    Operator:
      type: object
      properties:
        type:
          type: string
          enum: ["filter", "map", "flatMap", "aggregate", "window"]
        wasm:
          type: string
          description: "WASM module name"
        config:
          type: object
          additionalProperties: true

    TopologyInfo:
      type: object
      properties:
        name:
          type: string
        state:
          type: string
        parallelism:
          type: integer
          format: int32
        source_topic:
          type: string
        sink_topic:
          type: string
        operators:
          type: integer

    # ─── DLQ ───────────────────────────────────────────────

    DLQEntry:
      type: object
      properties:
        id:
          type: string
        original_topic:
          type: string
        body:
          type: string
          format: byte
        error:
          type: string
        retries:
          type: integer
        timestamp:
          type: string
          format: date-time

    DLQPeekResponse:
      type: object
      properties:
        topic:
          type: string
        count:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/DLQEntry"

    ReplayRequest:
      type: object
      properties:
        dry_run:
          type: boolean
          default: false
        max_messages:
          type: integer
          minimum: 0
        target_topic:
          type: string
        delete_after_replay:
          type: boolean
          default: false
        add_dlq_metadata:
          type: boolean
          default: false
        condition:
          type: object
          properties:
            reason:
              type: string
            min_retries:
              type: integer
            reason_pattern:
              type: string
            payload_contains:
              type: string

    ReplayResponse:
      type: object
      properties:
        replayed:
          type: integer
        failed:
          type: integer
        matched:
          type: integer
        total:
          type: integer
        skipped:
          type: integer
        dry_run:
          type: boolean
        topic:
          type: string
        errors:
          type: integer

    # ─── Tenants ───────────────────────────────────────────

    CreateTenantRequest:
      type: object
      required: ["id"]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        max_storage_bytes:
          type: integer
          format: int64
        max_topics:
          type: integer
        max_connections:
          type: integer
        max_publish_rate:
          type: integer
          format: int64
        max_fetch_rate:
          type: integer
          format: int64
        labels:
          type: object
          additionalProperties:
            type: string

    TenantInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        description:
          type: string

    TenantDetails:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        quotas:
          $ref: "#/components/schemas/TenantQuotasObject"
        labels:
          type: object
          additionalProperties:
            type: string

    TenantQuotas:
      type: object
      properties:
        tenant_id:
          type: string
        quotas:
          $ref: "#/components/schemas/TenantQuotasObject"

    TenantQuotasObject:
      type: object
      properties:
        max_storage_bytes:
          type: integer
          format: int64
        max_topics:
          type: integer
        max_connections:
          type: integer
          format: int64
        max_publish_rate:
          type: integer
          format: int64
        max_fetch_rate:
          type: integer
          format: int64

    UpdateQuotasRequest:
      type: object
      properties:
        max_storage_bytes:
          type: integer
          format: int64
        max_topics:
          type: integer
        max_connections:
          type: integer
        max_publish_rate:
          type: integer
          format: int64
        max_fetch_rate:
          type: integer
          format: int64

    TenantUsage:
      type: object
      description: "Tenant usage statistics (structure varies)"
      additionalProperties: true

    # ─── Exchanges ─────────────────────────────────────────

    CreateExchangeRequest:
      type: object
      required: ["name"]
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum: ["direct", "fanout", "topic", "headers"]
          default: "direct"
        durable:
          type: boolean
          default: false

    ExchangeInfo:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        bindings:
          type: integer

    ExchangeDetails:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/BindingInfo"

    BindingInfo:
      type: object
      properties:
        key:
          type: string
        destination:
          type: string
        arguments:
          type: object
          additionalProperties:
            type: string

    BindingRequest:
      type: object
      required: ["key", "destination"]
      properties:
        key:
          type: string
        destination:
          type: string
        arguments:
          type: object
          additionalProperties:
            type: string

    ExchangePublishRequest:
      type: object
      required: ["payload"]
      properties:
        routing_key:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        payload:
          type: string
          format: byte

    # ─── System ────────────────────────────────────────────

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "healthy"
        node_id:
          type: string
        name:
          type: string
        uptime:
          type: string
          description: "Human-readable uptime"

    ClusterResponse:
      type: object
      properties:
        mode:
          type: string
          example: "cluster"
        is_leader:
          type: boolean
        leader_id:
          type: string
        alive_count:
          type: integer
        members:
          type: array
          items:
            $ref: "#/components/schemas/ClusterMember"

    SingleNodeResponse:
      type: object
      properties:
        mode:
          type: string
          example: "single-node"
        members:
          type: "null"

    ClusterMember:
      type: object
      properties:
        id:
          type: string
        addr:
          type: string
          description: "IP address"
        port:
          type: integer
        state:
          type: string
          enum: ["Alive", "Dead", "Suspect", "Left"]
        incarnation:
          type: integer
          format: int64
