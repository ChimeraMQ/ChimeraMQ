  # ═══════════════════════════════════════════════════════════
  # EXCHANGES
  # ═══════════════════════════════════════════════════════════

  /v1/exchanges:
    post:
      tags: ["Exchanges"]
      summary: "Create exchange"
      operationId: createExchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExchangeRequest"
            example:
              name: "orders-exchange"
              type: "topic"
              durable: true
      responses:
        "201":
          description: "Exchange created"
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    type: string
                  durable:
                    type: boolean
              example:
                name: "orders-exchange"
                type: "topic"
                durable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: ["Exchanges"]
      summary: "List exchanges"
      operationId: listExchanges
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: "List of exchanges"
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchanges:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExchangeInfo"
                  count:
                    type: integer

  /v1/exchanges/{name}:
    get:
      tags: ["Exchanges"]
      summary: "Get exchange details"
      operationId: getExchange
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Exchange details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeDetails"
              example:
                name: "orders-exchange"
                type: "topic"
                bindings:
                  - key: "order.*"
                    destination: "orders-queue"
                  - key: "order.created"
                    destination: "notifications"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: ["Exchanges"]
      summary: "Delete exchange"
      operationId: deleteExchange
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Exchange deleted"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "deleted"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/exchanges/{name}/bindings:
    post:
      tags: ["Exchanges"]
      summary: "Bind exchange to destination"
      operationId: bindExchange
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindingRequest"
            example:
              key: "order.created"
              destination: "notifications"
              arguments:
                x-match: "all"
      responses:
        "200":
          description: "Exchange bound"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "bound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: ["Exchanges"]
      summary: "Unbind exchange"
      operationId: unbindExchange
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["key", "destination"]
              properties:
                key:
                  type: string
                destination:
                  type: string
            example:
              key: "order.created"
              destination: "notifications"
      responses:
        "200":
          description: "Exchange unbound"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "unbound"

  /v1/exchanges/{name}/publish:
    post:
      tags: ["Exchanges"]
      summary: "Publish message to exchange"
      operationId: publishToExchange
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangePublishRequest"
            example:
              routing_key: "order.created"
              headers:
                priority: "high"
              payload: "eyJvcmRlcl9pZCI6MTIzfQ=="
      responses:
        "200":
          description: "Publish result"
          content:
            application/json:
              schema:
                type: object
                properties:
                  routed:
                    type: integer
                  published:
                    type: integer
              example:
                routed: 2
                published: 2

