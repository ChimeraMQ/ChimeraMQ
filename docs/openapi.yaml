openapi: "3.0.3"
info:
  title: "ChimeraMQ API"
  description: |
    Admin HTTP API for ChimeraMQ — a unified message queue and event streaming platform.
    Runs on a separate admin port (default 9090). All endpoints except `/v1/health`
    require authentication via Bearer token or Basic Auth.
  version: "0.1.0"
  contact:
    name: "ChimeraMQ"
    url: "https://github.com/chimeramq/chimera"
  license:
    name: "Apache 2.0"
    url: "https://www.apache.org/licenses/LICENSE-2.0"

servers:
  - url: "http://localhost:9090"
    description: "Admin server (default port)"
  - url: "http://{host}:{adminPort}"
    description: "Admin server (custom port)"
    variables:
      host:
        default: "localhost"
      adminPort:
        default: "9090"
        description: "Configured admin port"

security:
  - BearerAuth: []
  - BasicAuth: []

tags:
  - name: "Topics"
    description: "Create, list, inspect, and delete topics"
  - name: "Messages"
    description: "Publish and consume messages, ack/nack"
  - name: "Consumer Groups"
    description: "Manage stream consumer groups, offsets, and membership"
  - name: "Schema Registry"
    description: "Register and manage schema versions with compatibility checks"
  - name: "WASM"
    description: "Upload, list, and delete WASM transform modules"
  - name: "Processors"
    description: "Create and manage stream processing topologies"
  - name: "DLQ"
    description: "Inspect, replay, preview, and export dead-letter queue entries"
  - name: "Tenants"
    description: "Multi-tenant management with quotas and usage tracking"
  - name: "Exchanges"
    description: "AMQP-style exchanges with bindings and routing"
  - name: "System"
    description: "Health, metrics, cluster, and configuration"
  - name: "Debug"
    description: "Go pprof profiling endpoints"

paths:
  # ═══════════════════════════════════════════════════════════
  # TOPICS
  # ═══════════════════════════════════════════════════════════

  /v1/topics:
    post:
      tags: ["Topics"]
      summary: "Create topic"
      operationId: createTopic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTopicRequest"
            example:
              name: "orders"
              mode: "unified"
              partitions: 4
              retention_time: "24h"
              dlq_topic: "orders.dlq"
              max_retries: 3
      responses:
        "201":
          description: "Topic created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTopicResponse"
              example:
                name: "orders"
                mode: "unified"
                partitions: 4
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: ["Topics"]
      summary: "List topics"
      operationId: listTopics
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: "List of topics"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopicInfo"
              example:
                - name: "orders"
                  mode: "unified"
                  partitions: 4
                  created_at: "2025-01-01T00:00:00Z"

  /v1/topics/{name}:
    get:
      tags: ["Topics"]
      summary: "Get topic details"
      operationId: getTopic
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Topic details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicDetails"
              example:
                name: "orders"
                partitions:
                  - id: 0
                    high_watermark: 1024
                    log_start_offset: 0
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: ["Topics"]
      summary: "Delete topic"
      operationId: deleteTopic
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Topic deleted"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "deleted"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════
  # MESSAGES
  # ═══════════════════════════════════════════════════════════

  /v1/messages/{topic}:
    post:
      tags: ["Messages"]
      summary: "Publish message"
      operationId: publishMessage
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            type: string
        - name: X-Routing-Key
          in: header
          required: false
          schema:
            type: string
          description: "Routing key for exchange-style routing"
      requestBody:
        required: true
        description: "Raw message body (any content type)"
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: object
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: "Message published"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponse"
              example:
                offset: 1024
                partition: 0
                topic: "orders"
    get:
      tags: ["Messages"]
      summary: "Fetch messages from stream"
      operationId: fetchMessages
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            type: string
        - name: partition
          in: query
          schema:
            type: integer
            format: int32
            default: 0
        - name: offset
          in: query
          schema:
            type: integer
            format: int64
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: timeout
          in: query
          schema:
            type: string
            default: "5s"
          description: "Long-poll timeout (Go duration, e.g. 5s, 100ms)"
      responses:
        "200":
          description: "Fetched messages"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchResponse"
              example:
                messages:
                  - offset: 1024
                    content_type: "application/json"
                    payload: "eyJvcmRlciI6MX0="
                    headers:
                      x-key: "YWJjMTIz"
                next_offset: 1025
                count: 1

  /v1/messages/{topic}/ack:
    post:
      tags: ["Messages"]
      summary: "Acknowledge messages (queue engine)"
      operationId: ackMessages
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AckNackRequest"
            example:
              offsets: [100, 101, 102]
      responses:
        "200":
          description: "Ack result"
          content:
            application/json:
              schema:
                type: object
                properties:
                  acked:
                    type: integer
                  total:
                    type: integer
              example:
                acked: 3
                total: 3

  /v1/messages/{topic}/nack:
    post:
      tags: ["Messages"]
      summary: "Negative acknowledge messages (may route to DLQ)"
      operationId: nackMessages
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AckNackRequest"
            example:
              offsets: [100, 101]
      responses:
        "200":
          description: "Nack result"
          content:
            application/json:
              schema:
                type: object
                properties:
                  nacked:
                    type: integer
                  dlq_routed:
                    type: integer
                  total:
                    type: integer
              example:
                nacked: 2
                dlq_routed: 1
                total: 2

  # ═══════════════════════════════════════════════════════════
  # CONSUMER GROUPS
  # ═══════════════════════════════════════════════════════════

  /v1/consumers:
    get:
      tags: ["Consumer Groups"]
      summary: "List consumer groups"
      operationId: listConsumers
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: "List of consumer groups"
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: string
                  count:
                    type: integer
              example:
                groups: ["group-alpha", "group-beta"]
                count: 2

  /v1/consumers/{group}:
    get:
      tags: ["Consumer Groups"]
      summary: "Get consumer group details"
      operationId: getConsumerGroup
      parameters:
        - name: group
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Consumer group details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerGroupInfo"
              example:
                group: "group-alpha"
                members:
                  - id: "consumer-1"
                    partitions: [0, 1]
                  - id: "consumer-2"
                    partitions: [2, 3]
                assignments:
                  consumer-1: [0, 1]
                  consumer-2: [2, 3]
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/consumers/{group}/join:
    post:
      tags: ["Consumer Groups"]
      summary: "Join consumer group"
      operationId: joinConsumerGroup
      parameters:
        - name: group
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGroupRequest"
            example:
              member_id: "consumer-1"
              topic: "orders"
              partitions: 4
              strategy: "range"
      responses:
        "200":
          description: "Joined group"
          content:
            application/json:
              schema:
                type: object
                properties:
                  group:
                    type: string
                  member_id:
                    type: string
                  assignments:
                    $ref: "#/components/schemas/AssignmentsMap"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/consumers/{group}/leave:
    post:
      tags: ["Consumer Groups"]
      summary: "Leave consumer group"
      operationId: leaveConsumerGroup
      parameters:
        - name: group
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["member_id"]
              properties:
                member_id:
                  type: string
            example:
              member_id: "consumer-1"
      responses:
        "200":
          description: "Left group"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "left"
                  group:
                    type: string
                  member_id:
                    type: string

  /v1/consumers/{group}/heartbeat:
    post:
      tags: ["Consumer Groups"]
      summary: "Consumer heartbeat"
      operationId: consumerHeartbeat
      parameters:
        - name: group
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["member_id"]
              properties:
                member_id:
                  type: string
            example:
              member_id: "consumer-1"
      responses:
        "200":
          description: "Heartbeat OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/consumers/{group}/offsets:
    get:
      tags: ["Consumer Groups"]
      summary: "Get committed offsets"
      operationId: getConsumerOffsets
      parameters:
        - name: group
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Committed offsets"
          content:
            application/json:
              schema:
                type: object
                properties:
                  group:
                    type: string
                  offsets:
                    $ref: "#/components/schemas/OffsetMap"
              example:
                group: "group-alpha"
                offsets:
                  "0": 1024
                  "1": 980
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: ["Consumer Groups"]
      summary: "Commit offsets"
      operationId: commitConsumerOffsets
      parameters:
        - name: group
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitOffsetsRequest"
            example:
              offsets:
                "0": 1025
                "1": 981
      responses:
        "200":
          description: "Commit result"
          content:
            application/json:
              schema:
                type: object
                properties:
                  committed:
                    type: integer
                  total:
                    type: integer
              example:
                committed: 2
                total: 2

  # ═══════════════════════════════════════════════════════════
  # SCHEMA REGISTRY
  # ═══════════════════════════════════════════════════════════

  /v1/schemas/{subject}:
    post:
      tags: ["Schema Registry"]
      summary: "Register schema version"
      operationId: registerSchema
      parameters:
        - name: subject
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSchemaRequest"
            example:
              type: "JSON"
              schema: |
                {
                  "type": "object",
                  "properties": {
                    "order_id": {"type": "string"},
                    "amount": {"type": "number"}
                  }
                }
      responses:
        "200":
          description: "Schema registered"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: ["Schema Registry"]
      summary: "List schema versions for subject"
      operationId: listSchemas
      parameters:
        - name: subject
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Schema versions"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchemaVersion"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: ["Schema Registry"]
      summary: "Delete schema subject"
      operationId: deleteSubject
      parameters:
        - name: subject
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "Subject deleted"

  /v1/schemas/{subject}/latest:
    get:
      tags: ["Schema Registry"]
      summary: "Get latest schema version"
      operationId: getLatestSchema
      parameters:
        - name: subject
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Latest schema"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaVersion"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/schemas/{subject}/versions/{version}:
    get:
      tags: ["Schema Registry"]
      summary: "Get schema by version number"
      operationId: getSchemaVersion
      parameters:
        - name: subject
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Schema version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/schemas/{subject}/compatibility:
    put:
      tags: ["Schema Registry"]
      summary: "Set compatibility mode"
      operationId: setCompatibility
      parameters:
        - name: subject
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["mode"]
              properties:
                mode:
                  type: string
                  enum: ["none", "backward", "forward", "full"]
            example:
              mode: "backward"
      responses:
        "200":
          description: "Compatibility mode updated"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "updated"

  # ═══════════════════════════════════════════════════════════
  # WASM
  # ═══════════════════════════════════════════════════════════

  /v1/wasm/modules:
    post:
      tags: ["WASM"]
      summary: "Upload WASM module"
      operationId: uploadWasmModule
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: "Module name"
      requestBody:
        required: true
        description: "WASM binary (.wasm)"
        content:
          application/wasm:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: "Module compiled"
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  status:
                    type: string
                    example: "compiled"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: ["WASM"]
      summary: "List WASM modules"
      operationId: listWasmModules
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: "List of WASM modules"
          content:
            application/json:
              schema:
                type: object
                properties:
                  modules:
                    type: array
                    items:
                      type: string
                  count:
                    type: integer
              example:
                modules: ["transform-orders", "enrich-events"]
                count: 2

  /v1/wasm/modules/{name}:
    delete:
      tags: ["WASM"]
      summary: "Delete WASM module"
      operationId: deleteWasmModule
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "Module deleted"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════
  # PROCESSORS
  # ═══════════════════════════════════════════════════════════

  /v1/processors:
    post:
      tags: ["Processors"]
      summary: "Create stream processing topology"
      operationId: createTopology
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopologySpec"
            example:
              name: "order-enricher"
              auto_start: true
              parallelism: 2
              source:
                topic: "raw-orders"
              sink:
                topic: "enriched-orders"
              operators:
                - type: "map"
                  wasm: "transform-orders"
      responses:
        "201":
          description: "Topology created"
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  status:
                    type: string
                    example: "created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: ["Processors"]
      summary: "List processing topologies"
      operationId: listTopologies
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: "List of topology names"
          content:
            application/json:
              schema:
                type: object
                properties:
                  topologies:
                    type: array
                    items:
                      type: string
                  count:
                    type: integer
              example:
                topologies: ["order-enricher", "event-aggregator"]
                count: 2

  /v1/processors/{name}:
    get:
      tags: ["Processors"]
      summary: "Get topology details"
      operationId: getTopology
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Topology details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyInfo"
              example:
                name: "order-enricher"
                state: "1"
                parallelism: 2
                source_topic: "raw-orders"
                sink_topic: "enriched-orders"
                operators: 1
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: ["Processors"]
      summary: "Delete topology"
      operationId: deleteTopology
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "Topology deleted"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/processors/{name}/start:
    post:
      tags: ["Processors"]
      summary: "Start topology"
      operationId: startTopology
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Topology started"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "running"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/processors/{name}/stop:
    post:
      tags: ["Processors"]
      summary: "Stop topology"
      operationId: stopTopology
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Topology stopped"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "stopped"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════
  # DLQ
  # ═══════════════════════════════════════════════════════════

  /v1/dlq/{topic}:
    get:
      tags: ["DLQ"]
      summary: "Peek DLQ entries"
      operationId: peekDLQ
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: "DLQ entries"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLQPeekResponse"
              example:
                topic: "orders"
                count: 2
                entries:
                  - id: "uuid-1"
                    original_topic: "orders"
                    body: "eyJpZCI6MX0="
                    error: "timeout"
                    retries: 3
                    timestamp: "2025-01-01T00:00:00Z"
    delete:
      tags: ["DLQ"]
      summary: "Clear DLQ"
      operationId: clearDLQ
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "DLQ cleared"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "cleared"

  /v1/dlq/{topic}/replay:
    post:
      tags: ["DLQ"]
      summary: "Replay DLQ messages"
      operationId: replayDLQ
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayRequest"
            example:
              dry_run: false
              max_messages: 100
              target_topic: "orders"
              delete_after_replay: true
              add_dlq_metadata: true
              condition:
                reason: "timeout"
                min_retries: 3
      responses:
        "200":
          description: "Replay result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayResponse"
              example:
                replayed: 95
                failed: 5
                matched: 100
                total: 120
                skipped: 20
                dry_run: false
                topic: "orders"
                errors: 0

  /v1/dlq/{topic}/preview:
    post:
      tags: ["DLQ"]
      summary: "Preview DLQ entries matching conditions"
      operationId: previewDLQ
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                max_messages:
                  type: integer
                  default: 100
                condition:
                  type: object
                  properties:
                    reason:
                      type: string
                    min_retries:
                      type: integer
                    reason_pattern:
                      type: string
                    payload_contains:
                      type: string
            example:
              max_messages: 50
              condition:
                reason: "timeout"
      responses:
        "200":
          description: "Preview entries"
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/DLQEntry"
                  count:
                    type: integer
                  topic:
                    type: string

  /v1/dlq/{topic}/export:
    get:
      tags: ["DLQ"]
      summary: "Export DLQ entries as JSON file"
      operationId: exportDLQ
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            type: string
        - name: max_messages
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: "JSON file download"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DLQEntry"

  # ═══════════════════════════════════════════════════════════
  # TENANTS
  # ═══════════════════════════════════════════════════════════

  /v1/tenants:
    post:
      tags: ["Tenants"]
      summary: "Create tenant"
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
            example:
              id: "tenant-alpha"
              name: "Alpha Corp"
              description: "Alpha Corporation tenant"
              max_storage_bytes: 10737418240
              max_topics: 50
              max_connections: 100
              max_publish_rate: 10000
              max_fetch_rate: 50000
              labels:
                environment: "production"
                team: "alpha"
      responses:
        "201":
          description: "Tenant created"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    example: "created"
                  enabled:
                    type: boolean
              example:
                id: "tenant-alpha"
                name: "Alpha Corp"
                status: "created"
                enabled: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: ["Tenants"]
      summary: "List tenants"
      operationId: listTenants
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: "List of tenants"
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantInfo"
                  count:
                    type: integer

  /v1/tenants/{id}:
    get:
      tags: ["Tenants"]
      summary: "Get tenant"
      operationId: getTenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Tenant details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantDetails"
              example:
                id: "tenant-alpha"
                name: "Alpha Corp"
                description: "Alpha Corporation tenant"
                enabled: true
                created_at: "2025-01-01T00:00:00Z"
                quotas:
                  max_storage_bytes: 10737418240
                  max_topics: 50
                  max_connections: 100
                  max_publish_rate: 10000
                  max_fetch_rate: 50000
                labels:
                  environment: "production"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: ["Tenants"]
      summary: "Delete tenant"
      operationId: deleteTenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Tenant deleted"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    example: "deleted"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tenants/{id}/usage:
    get:
      tags: ["Tenants"]
      summary: "Get tenant usage statistics"
      operationId: getTenantUsage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Usage statistics"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUsage"

  /v1/tenants/{id}/quotas:
    get:
      tags: ["Tenants"]
      summary: "Get tenant quotas"
