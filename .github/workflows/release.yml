name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c17d8b5a82a1c0ea9291374a8 # v5.2.0
        with:
          go-version: '1.25'

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.date=$DATE"

          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          mkdir -p dist
          for PLATFORM in "${PLATFORMS[@]}"; do
            IFS='/' read -r GOOS GOARCH <<< "$PLATFORM"
            echo "Building for $GOOS/$GOARCH..."
            GOOS=$GOOS GOARCH=$GOARCH go build \
              -ldflags "$LDFLAGS" \
              -o "dist/chimera-${VERSION}-${GOOS}-${GOARCH}" \
              ./cmd/chimera
          done

      - name: Verify binaries
        run: |
          cd dist
          echo "Verifying cross-platform binaries..."
          for f in chimera-*; do
            # Check file is not empty
            if [ ! -s "$f" ]; then
              echo "FAIL: $f is empty"
              exit 1
            fi
            echo "  OK: $f ($(du -h "$f" | cut -f1))"
          done
          echo "All binaries verified successfully."

      - name: Create archives
        run: |
          cd dist
          for f in chimera-*; do
            if [[ "$f" == *windows* ]]; then
              zip "${f}.zip" "$f"
            else
              tar czf "${f}.tar.gz" "$f"
            fi
          done

      - name: Smoke test (linux/amd64)
        run: |
          cd dist
          BINARY=$(ls chimera-*-linux-amd64 | head -1)
          chmod +x "$BINARY"

          # Verify binary runs and prints help
          ./$BINARY --help > /dev/null 2>&1 || { echo "FAIL: --help failed"; exit 1; }
          echo "  OK: --help"

          # Verify version flag works
          VERSION_OUTPUT=$("./$BINARY" version 2>&1 || true)
          echo "  Version output: $VERSION_OUTPUT"
          echo "  OK: version"

          # Verify server starts (and stop quickly)
          ./$BINARY server --config /dev/null &
          SERVER_PID=$!
          sleep 2
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "  OK: server started"
            kill $SERVER_PID
            wait $SERVER_PID 2>/dev/null || true
          else
            echo "  WARN: server did not stay up (expected with no config)"
          fi
          echo "Smoke test passed."

      - name: Run tests
        run: go test -count=1 -timeout 120s ./...

      - name: Create release
        uses: softprops/action-gh-release@c95fe1489396fe9a335974e61bc4af167b9e07ef # v2.2.1
        with:
          files: dist/*
          generate_release_notes: true
