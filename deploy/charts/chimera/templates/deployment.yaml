apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chimera.fullname" . }}
  labels:
    {{- include "chimera.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "chimera.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chimera.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: chimera
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.config.listener.port }}
              name: protocol
            - containerPort: {{ .Values.config.listener.admin_port }}
              name: admin
          env:
            - name: CHIMERA_LOG_LEVEL
              value: {{ .Values.config.logging.level | quote }}
            - name: CHIMERA_ADMIN_TOKEN
              {{- if .Values.auth.token.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.token.existingSecret.name }}
                  key: {{ .Values.auth.token.existingSecret.key | default "admin-token" }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "chimera.fullname" . }}-token
                  key: admin-token
              {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/chimera/chimera.yaml
              subPath: chimera.yaml
            - name: data
              mountPath: {{ .Values.config.node.data_dir }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "chimera.fullname" . }}-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "chimera.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
