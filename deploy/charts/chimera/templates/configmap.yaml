apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chimera.fullname" . }}-config
  labels:
    {{- include "chimera.labels" . | nindent 4 }}
data:
  chimera.yaml: |
    node:
      id: {{ .Release.Revision }}
      name: {{ include "chimera.fullname" . }}
      data_dir: {{ .Values.config.node.data_dir }}
    listener:
      bind: {{ .Values.config.listener.bind }}
      port: {{ .Values.config.listener.port }}
      admin_port: {{ .Values.config.listener.admin_port }}
      max_connections: {{ .Values.config.listener.max_connections }}
    storage:
      hot:
        segment_size: {{ .Values.config.storage.hot.segment_size }}
        sync_mode: {{ .Values.config.storage.hot.sync_mode }}
        sync_interval: {{ .Values.config.storage.hot.sync_interval }}
    defaults:
      topic:
        partitions: {{ .Values.config.defaults.topic.partitions }}
        mode: {{ .Values.config.defaults.topic.mode }}
    logging:
      level: {{ .Values.config.logging.level }}
      format: {{ .Values.config.logging.format }}
    auth:
      type: {{ .Values.config.auth.type }}
      tokens:
        admin: "${CHIMERA_ADMIN_TOKEN}"
    observability:
      tracing:
        enabled: {{ .Values.config.observability.tracing.enabled }}
      dashboard:
        enabled: {{ .Values.config.observability.dashboard.enabled }}
    dlq:
      enabled: {{ .Values.config.dlq.enabled }}
      topic_prefix: {{ .Values.config.dlq.topic_prefix }}
      max_retries: {{ .Values.config.dlq.max_retries }}
    flow_control:
      enabled: {{ .Values.config.flow_control.enabled }}
      high_watermark_mb: {{ .Values.config.flow_control.high_watermark_mb }}
      low_watermark_mb: {{ .Values.config.flow_control.low_watermark_mb }}
