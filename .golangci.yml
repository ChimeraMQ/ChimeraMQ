run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - misspell
    - gofmt
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

settings:
  errcheck:
    check-type-assertions: false
  govet:
    enable-all: false

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
